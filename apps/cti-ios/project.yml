# project.yml is the source of truth for the Xcode project; the generated
# CTICallerID.xcodeproj is NOT committed (see .gitignore). Regenerate with
# `xcodegen generate` after changing anything here or adding a source file.
name: CTICallerID

options:
  bundleIdPrefix: com.gghomes.cti
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  # ---------------------------------------------------------------------------
  # The app: pairs with the CTI server, pulls the caller directory, writes the
  # App Group snapshot the extension reads, and asks CallKit to reload it.
  # ---------------------------------------------------------------------------
  CTICallerID:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: CallDirectory
    entitlements:
      path: App/CTICallerID.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gghomes.cti
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CTI Caller ID
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background refresh only. NO push entitlement/handler in this app —
        # silent push is a deferred fast-follow (see README).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.gghomes.cti.callerid.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.cti.callerid
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only — set per target because XcodeGen's own iOS target
        # default ("1,2") overrides anything set at project level.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: CCY3R86SMX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CTI CallerID AppStore

  # ---------------------------------------------------------------------------
  # The Call Directory extension: reads the App Group snapshot and streams it
  # to CallKit. No network, no Keychain — it only ever reads DirectoryStore,
  # so it compiles DirectoryStore.swift and Feed.swift (for DirectoryEntry)
  # rather than importing the app.
  # ---------------------------------------------------------------------------
  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectory
      - path: Shared/AppConfig.swift
      - path: Shared/Feed.swift
      - path: App/DirectoryStore.swift
    entitlements:
      path: CallDirectory/CallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gghomes.cti
    info:
      path: CallDirectory/Info.plist
      properties:
        CFBundleDisplayName: CTI Caller ID
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.cti.callerid.directory
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: CCY3R86SMX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CTI CallDirectory AppStore

  # ---------------------------------------------------------------------------
  # Logic tests. Deliberately host-free: everything under test takes its
  # collaborators by injection (paging over a transport, a file-backed store
  # over a container URL, the sync engine over a token store, a pull, and
  # CallKit), so the bundle compiles those sources directly instead of
  # standing up a host app and an App Group container on the simulator.
  # ---------------------------------------------------------------------------
  CTICallerIDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/AppConfig.swift
      - path: Shared/Feed.swift
      - path: Shared/PairingClient.swift
      - path: App/DirectoryStore.swift
      - path: App/Keychain.swift
      - path: App/SyncEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.cti.callerid.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  # The brief's scheme: builds app + extension + tests, then runs the tests.
  CTICallerID:
    build:
      targets:
        CTICallerID: all
        CTICallerIDTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CTICallerIDTests
  # Fast inner loop: the logic tests alone, without building the app.
  CTICallerIDTests:
    build:
      targets:
        CTICallerIDTests: [test]
    test:
      config: Debug
      targets:
        - CTICallerIDTests
