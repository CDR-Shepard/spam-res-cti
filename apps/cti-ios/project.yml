# project.yml is the source of truth for the Xcode project; the generated
# Callsign.xcodeproj is NOT committed (see .gitignore). Regenerate with
# `xcodegen generate` after changing anything here or adding a source file.
name: Callsign

packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    # Pinned, not a floor: 6.13.7 is the version the full test suite (incl.
    # the manual device checklist in docs/runbooks/callsign-ios-release.md)
    # was validated against. Bump deliberately — re-run that checklist on a
    # real device before shipping a new pin, don't just let SPM float to
    # whatever the next `from:` range resolves.
    exactVersion: "6.13.7"

options:
  bundleIdPrefix: com.gghomes.cti
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  # ---------------------------------------------------------------------------
  # The app: pairs with the CTI server, pulls the caller directory, writes the
  # App Group snapshot the extension reads, and asks CallKit to reload it.
  # ---------------------------------------------------------------------------
  Callsign:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: CallDirectory
      - package: TwilioVoice
        product: TwilioVoice
    entitlements:
      path: App/Callsign.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gghomes.cti
        aps-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Callsign
        CFBundleIconName: AppIcon
        # Both build settings above, resolved at build time. Without these two
        # keys XcodeGen writes literal "1.0"/"1" into the generated plist and
        # `MARKETING_VERSION`/`CURRENT_PROJECT_VERSION` are ignored — so every
        # upload carries build 1 and App Store Connect rejects the second one.
        # The app and the extension MUST resolve to the same pair, which they
        # do because both settings are set once at project level.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # VoIP push (PushKit) + audio session for the softphone, plus the
        # existing background refresh.
        UIBackgroundModes:
          - voip
          - audio
          - fetch
        # Required the moment a recording-capable AVAudioSession activates
        # (Twilio via CallKit's didActivate, on the first call) — without
        # this key iOS terminates the process outright instead of prompting,
        # and App Store validation rejects the binary.
        NSMicrophoneUsageDescription: "Callsign uses the microphone so you can talk on your calls."
        BGTaskSchedulerPermittedIdentifiers:
          - com.gghomes.callsign.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.callsign
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only — set per target because XcodeGen's own iOS target
        # default ("1,2") overrides anything set at project level.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: CCY3R86SMX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Callsign AppStore

  # ---------------------------------------------------------------------------
  # The Call Directory extension: reads the App Group snapshot and streams it
  # to CallKit. No network, no Keychain — it only ever reads DirectoryStore,
  # so it compiles DirectoryStore.swift and Feed.swift (for DirectoryEntry)
  # rather than importing the app.
  # ---------------------------------------------------------------------------
  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectory
      - path: Shared/AppConfig.swift
      - path: Shared/Feed.swift
      - path: App/DirectoryStore.swift
    entitlements:
      path: CallDirectory/CallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gghomes.cti
    info:
      path: CallDirectory/Info.plist
      properties:
        CFBundleDisplayName: Callsign
        # Must match the app's exactly — an app extension whose version pair
        # differs from its host's is rejected at upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.callsign.directory
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: CCY3R86SMX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Callsign Directory AppStore

  # ---------------------------------------------------------------------------
  # Logic tests. Deliberately host-free: everything under test takes its
  # collaborators by injection (paging over a transport, a file-backed store
  # over a container URL, the sync engine over a token store, a pull, and
  # CallKit, the call controller over the voice SDK / CallKit / calls-API
  # protocols), so the bundle compiles those sources directly instead of
  # standing up a host app and an App Group container on the simulator.
  # ---------------------------------------------------------------------------
  CallsignTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/AppConfig.swift
      - path: Shared/Feed.swift
      - path: Shared/PairingClient.swift
      - path: Shared/SessionClient.swift
      - path: Shared/DeviceRegistrationClient.swift
      - path: Shared/SignInFlow.swift
      - path: Shared/VoiceTokenClient.swift
      - path: Shared/CallsAPI.swift
      - path: App/DirectoryStore.swift
      - path: App/Keychain.swift
      - path: App/SyncEngine.swift
      - path: App/SessionTokenStore.swift
      - path: App/SignOutFlow.swift
      - path: App/SessionExpiry.swift
      - path: App/CallerInfo.swift
      - path: App/VoiceProtocols.swift
      - path: App/CallController.swift
      # Task 10's screens keep every decision in a pure view-model beside the
      # SwiftUI file that draws it — what the refusal banner says and how it is
      # styled, which modal covers the tabs for a phase, when Save/Skip are
      # live, how a call row renders and redials. Those compile here; the
      # `View`s themselves import SwiftUI/UIKit/AVFAudio and stay out.
      - path: App/Dispositions.swift
      - path: App/DialViewModel.swift
      - path: App/CallRoute.swift
      - path: App/WrapupViewModel.swift
      - path: App/RecentsRowModel.swift
      - path: App/CallsFeedStore.swift
      # The three pieces of the live voice stack that hold a rule rather than
      # a framework call, and so can be pinned without a simulator: the access
      # token's cache/expiry arithmetic, the early-disconnect replay, and the
      # VoIP push classifier. The adapters around them import TwilioVoice,
      # PushKit and CallKit and are deliberately not in this bundle.
      - path: App/VoiceTokenRefresher.swift
      - path: App/DisconnectLatch.swift
      - path: App/VoicePushPayload.swift
      - path: App/ConnectGate.swift
      - path: App/RingCancellation.swift
      - path: App/OutgoingCallLedger.swift
      # Not itself under test: `CallController.swift` (which is) calls
      # `onMainActor`, so the bundle has to compile the one definition of it.
      - path: App/MainActorHop.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gghomes.callsign.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  # The brief's scheme: builds app + extension + tests, then runs the tests.
  Callsign:
    build:
      targets:
        Callsign: all
        CallsignTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CallsignTests
  # Fast inner loop: the logic tests alone, without building the app.
  CallsignTests:
    build:
      targets:
        CallsignTests: [test]
    test:
      config: Debug
      targets:
        - CallsignTests
